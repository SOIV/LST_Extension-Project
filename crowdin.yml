project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

files:
  # Chrome/Firefox Extension locales
  - source: /All-Extension_App/Chrome_Extension/_locales/ko/messages.json
    translation: /All-Extension_App/Chrome_Extension/_locales/%two_letters_code%/messages.json
    type: chrome_json

  # Platform (Next.js) messages
  - source: /platform/src/messages/ko.json
    translation: /platform/src/messages/%two_letters_code%.json
    type: json

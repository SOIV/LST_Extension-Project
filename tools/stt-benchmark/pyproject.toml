[project]
name = "lst-stt-bench"
version = "0.1.0"
description = "LST 실시간 STT 엔진 정확도/지연 벤치마크"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "av>=12",
  "httpx>=0.27",
  "jiwer>=3.0",
  "numpy>=1.26",
  "websockets>=14",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
stt-bench = "stt_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
